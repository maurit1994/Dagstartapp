# Netlify deploy config for Anker.
[build]
  command = "npm run build"
  publish = "dist"

# Anker is a single-page app: every URL must serve index.html so React can
# render, instead of Netlify looking for a file that is not there.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from cache, or the app can get
# stuck on an old version after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
